# Desktop packages for macOS (arm64, x64) and Linux (x64, arm64). Each package is built on its own
# OS and CPU: the Claude Code binary (an Agent SDK optional dependency) and whisper-cli are native.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: mac-arm64 }
          - { os: macos-15-intel, name: mac-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Copy the HyperFrames and anatomy skills into the plugin
        run: npm run sync-skills

      - name: Cache whisper-cli
        uses: actions/cache@v4
        with:
          path: vendor/whisper
          key: whisper-v1.9.5-${{ matrix.name }}-${{ hashFiles('scripts/build-whisper.sh') }}

      - name: Build whisper-cli
        run: npm run build:whisper

      - name: Package
        # Unset signing variables whose secrets are missing: electron-builder reads an empty CSC_LINK
        # as a path (the working directory) and fails with "not a file".
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run dist
        env:
          # macOS signing and notarization run only when these secrets exist.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATE != '' }}

      - uses: actions/upload-artifact@v5
        with:
          name: stoa-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # A tag push (v1.2.3) collects every package into a draft GitHub release. Publish the draft to
  # ship it: the desktop app checks the latest published release (desktop/updater.ts) and verifies
  # each download against the SHA-256 digest GitHub records for the asset.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($want). Bump the version first."
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          path: dist-release
          merge-multiple: true

      - name: Checksums
        working-directory: dist-release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* --draft --title "Stoa ${GITHUB_REF_NAME#v}" --generate-notes
          fi
